# FerroSMART with Keycloak as its upstream OpenID Connect provider, for login
# only (#522, docs/architecture.md §13.2): Keycloak authenticates the person,
# FerroSMART issues the SMART tokens. Every name here matches
# ferrosmart-realm.json beside this file. The secrets are files the operator
# creates (scripts/idp/keycloak-launch.sh makes them for its run).

[ferrosmart]
# The issuer a browser and the provider's redirect reach FerroSMART by:
# plain http on a loopback host (RFC 8414 §3, as ferrohealth-smart reads it).
issuer = "http://localhost:8080"

[[ferrosmart.resource]]
base = "http://localhost:8090/fhir"
kind = "fhir"

# The provider. Its discovery document is
# {issuer}/.well-known/openid-configuration (OpenID Connect Discovery 1.0
# §4), and FerroSMART is its confidential client `ferrosmart`, sending the
# secret as HTTP Basic (OpenID Connect Core 1.0 §9, client_secret_basic).
[ferrosmart.upstream]
issuer = "http://localhost:8180/realms/ferrosmart"
client_id = "ferrosmart"
scopes = ["openid"]
# The realm's user attribute mapper writes the user's `fhir_user` attribute
# into the ID Token under this name, and its realm role mapper writes the
# realm roles as the `roles` array (ferrosmart-realm.json).
fhir_user_claim = "fhir_user"
role_claims = ["roles"]

# The policy as content (docs/architecture.md §13.6 item 5): a person with the
# realm role `clinician` may be granted these user/ scopes.
[[ferrosmart.role]]
name = "clinician"
scopes = ["user/Patient.rs", "user/Observation.rs"]

# The example's SMART app: a public client, PKCE alone (SMART App Launch
# 2.2.0, Client Types, client-public).
[[ferrosmart.client]]
client_id = "example-app"
name = "Example SMART app"
kind = "public"
redirect_uris = ["http://localhost:9000/callback"]
scopes = ["openid", "fhirUser", "user/Patient.rs", "user/Observation.rs"]
grant_types = ["authorization_code"]
