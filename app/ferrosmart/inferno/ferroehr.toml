# FerroEHR as the CDR behind FerroBRIDGE in the Inferno lane (#520). It holds
# the PERSON the facade serves as the person's Practitioner and answers on
# the loopback interface to FerroBRIDGE alone, so it checks no caller: the
# lane tests FerroSMART, and the CDR is the facade's store.

[deployment]
profile = "sandbox"

[server]
listen = "127.0.0.1:9080"

[record]
subject_index = "local"

# An example provider id under the OID arc 2.999, which ITU-T X.660 reserves
# for examples.
[authz.party_binding]
provider = { issuer = "urn:oid:2.999.7.9", id = "inferno-lane" }

[auth]
enabled = false
