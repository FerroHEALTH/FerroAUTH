# The Inferno execution script of the lane (#520): `inferno execute_script`
# (inferno_core 1.4.3) creates one `smart_stu2_2` session and runs each group
# groups.tsv marks `run`. A group marked `pending` gets its step here when the
# FerroSMART step it waits on has merged. The run fails unless every result
# matches smart_stu2_2_expected.json, which scripts/inferno/lane.sh holds to
# `pass` for every test outside exceptions.tsv. Group 4 runs first, while the
# introspection token the lane fetched for it is fresh.

sessions:
  - suite: smart_stu2_2

comparison_config:
  expected_results_file: smart_stu2_2_expected.json
  # The values each run makes anew, as the kit's own scripts normalize them.
  normalized_strings:
    - replacement: <UUID>
      pattern: /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i
    - replacement: code_challenge=<CODE_CHALLENGE>
      pattern: /code_challenge=[A-Za-z0-9+\/=_-]{43}/

steps:
  - state_description: Session created
    status: created
    start_run:
      runnable: "4"
      inputs:
        url: https://bridge.localhost:9443/fhir
        standalone_smart_auth_info:
          auth_type: public
          use_discovery: "true"
          client_id: inferno-standalone
          requested_scopes: openid fhirUser user/Practitioner.rs
          pkce_support: enabled
          pkce_code_challenge_method: S256
          auth_request_method: GET
        custom_authorization_header: "@/lane/introspection-header.txt"
    action_description: Run group 4, Token Introspection

  - state_description: Waiting at 4.1.2.02, the authorization server redirects the browser to the app
    status: waiting
    last_completed: "4.1.2.02"
    command: /repo/scripts/idp/authorize.sh keycloak '{wait_outputs.authorization_url}' --follow
    action_description: Log in at Keycloak as the lane's clinician and approve every scope offered

  - state_description: Group 4 Token Introspection finished
    status: done
    last_completed: "4"
    start_run:
      runnable: "3"
      inputs:
        url: https://bridge.localhost:9443/fhir
        backend_services_smart_auth_info:
          auth_type: backend_services
          use_discovery: "true"
          client_id: inferno-backend-services
          requested_scopes: system/Practitioner.rs
          encryption_algorithm: ES384
    action_description: Run group 3, Backend Services

  - state_description: Group 3 Backend Services finished
    status: done
    last_completed: "3"
    action: END_SCRIPT
    action_description: End the script
