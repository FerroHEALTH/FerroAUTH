  <rect x="0" y="0" width="64" height="64" rx="14" fill="#FBBF24"/>
  <path d="M32 8 L51 14.5 V30 C51 43 43 51.5 32 56.5 C21 51.5 13 43 13 30 V14.5 Z" fill="none" stroke="#78350F" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="32" cy="28" r="6" fill="#78350F"/>
  <path d="M32 32 V42" stroke="#78350F" stroke-width="6" stroke-linecap="round"/>
</svg>
