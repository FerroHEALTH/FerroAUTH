<!-- One lockup for both themes: the media query inside the SVG switches the
     mark and wordmark tones on prefers-color-scheme, so a README or a page
     serves one file to a light and a dark reader. -->
<svg xmlns="http://www.w3.org/2000/svg" width="258" height="64" viewBox="0 0 258 64" role="img" aria-label="FerroAUTH">
  <title>FerroAUTH</title>
  <style>
    .c0-stroke { stroke: #78350F }
    .c1-fill { fill: #FBBF24 }
    .c1-stroke { stroke: #FBBF24 }
    .wm { fill: #0F172A; }
    @media (prefers-color-scheme: dark) {
      .c0-stroke { stroke: #FBBF24 }
      .c1-fill { fill: #F1F5F9 }
      .c1-stroke { stroke: #F1F5F9 }
      .wm { fill: #F1F5F9; }
    }
  </style>
  <g>
  <path d="M32 6 L52 13 V30 C52 44 43 53 32 58 C21 53 12 44 12 30 V13 Z" fill="none" class="c0-stroke" stroke-width="4.6" stroke-linejoin="round"/>
  <circle cx="32" cy="28" r="5.5" class="c1-fill"/>
  <path d="M32 32 V42" class="c1-stroke" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text class="wm" x="76" y="44" font-family="'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="-0.3">FerroAUTH</text>
</svg>
