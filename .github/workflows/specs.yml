# The vendored-specification guard (no specification governs this: our own
# design). It runs offline: every pin in docs/VERSIONS.md is read back
# against the vendored trees and their PROVENANCE.md files, so a hand-edited
# vendored file, a moved pin or a stale provenance fails the pull request.
name: Vendored specifications

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions: {}

jobs:
  versions:
    name: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every pin agrees with docs/VERSIONS.md and every vendored byte with its provenance
        run: bash scripts/checks/versions.sh
