# Re-runs the pull-request guard of ci.yml that reads the description when the
# description changes (#77).
#
# ci.yml runs on `opened`, `synchronize` and `reopened` only. An `edited`
# event would start a second run on the same commit, the concurrency group
# would cancel the first, and that run's `conclusion`, the required check,
# would report a failure. contribution-licence reads the description from the
# API when it runs instead. When the description changes, this job waits for
# the CI run on the head commit to complete and re-runs that guard.
# Re-running a job re-runs its dependent jobs ("Re-run a job and its
# dependent jobs in a workflow run",
# https://docs.github.com/en/rest/actions/workflow-runs#re-run-a-job-from-a-workflow-run),
# so `conclusion` reports again in the same run.
#
# Nothing a merge depends on is decided here: the guard reads the pull
# request itself, and `conclusion` fails until a re-run passes. A pull request
# from a fork gets a read-only token, so a maintainer re-runs the guard by
# hand.
name: PR guards

on:
  pull_request:
    branches: [main]
    types: [edited]

concurrency:
  group: pr-guards-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  rerun:
    name: pr-guards
    if: github.event.changes.body != null
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write # read the CI run and re-run its guard jobs
      pull-requests: read # the head commit of the pull request now
    steps:
      - name: Re-run the description guard once the CI run completes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          guards=(contribution-licence)

          # A new description can turn a pass into a failure and a failure
          # into a pass; a skip (a bot's pull request) holds.
          stale() {
            case "$1" in
              success | failure) return 0 ;;
              *) return 1 ;;
            esac
          }

          run=""
          for _ in $(seq 1 30); do
            run=$(gh run list --workflow ci.yml --commit "${HEAD}" --event pull_request \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "${run}" ] && break
            sleep 10
          done
          if [ -z "${run}" ]; then
            echo "::error::no CI run on ${HEAD} to re-run ${guards[*]} in"
            exit 1
          fi

          handled=" "
          for _ in $(seq 1 20); do
            gh run watch "${run}" --interval 30 > /dev/null
            if [ "$(gh run view "${run}" --json conclusion --jq .conclusion)" = "cancelled" ]; then
              echo "CI run ${run} was cancelled; the run that replaced it reads the pull request itself"
              exit 0
            fi
            # Re-running an older commit's run would cancel the newer commit's
            # run, which shares its concurrency group.
            if [ "$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq .head.sha)" != "${HEAD}" ]; then
              echo "the pull request moved past ${HEAD}; the run of its new head reads the pull request itself"
              exit 0
            fi
            # A failed read is retried, never taken for a missing guard (#79).
            if ! jobs=$(gh run view "${run}" --json jobs \
              --jq '.jobs[] | "\(.name)\t\(.databaseId) \(.conclusion)"'); then
              sleep 15
              continue
            fi
            next=""
            for guard in "${guards[@]}"; do
              case "${handled}" in *" ${guard} "*) continue ;; esac
              job="" outcome=""
              read -r job outcome < <(awk -F '\t' -v g="${guard}" '$1 == g { print $2; exit }' <<<"${jobs}") || true
              if [ -z "${job}" ]; then
                echo "${guard} is not a job of CI run ${run}"
              elif stale "${outcome}"; then
                next="${job} ${guard}"
                break
              else
                echo "${guard} reported ${outcome}, which still holds"
              fi
              handled+="${guard} "
            done
            if [ -z "${next}" ]; then
              exit 0
            fi
            read -r job guard <<<"${next}"
            if gh run rerun --job "${job}"; then
              echo "re-ran ${guard} and its dependents in CI run ${run}"
              handled+="${guard} "
            fi
            sleep 15
          done
          echo "::error::could not re-run ${guards[*]} in CI run ${run}; re-run it by hand"
          exit 1
