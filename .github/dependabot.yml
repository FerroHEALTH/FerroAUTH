version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "cargo"
    directory: "/"
    labels:
      - "dependencies"
    # Daily, so a release of a FerroHEALTH family crate reaches a pull request
    # the next day. A group takes its entry's schedule, and two cargo entries
    # may not share a directory (the Dependabot options reference), so the
    # whole entry runs daily; the cooldown still holds every other crate back
    # for its days.
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
      # The family's own crates, published through Trusted Publishing: no wait.
      exclude:
        - "ferrohealth-*"
        - "openehr-*"
        - "ferrobridge-*"
        - "fhir-types"
        - "hl7v2-types"
        - "fhirconnect"
        - "eehrxf"
        - "ihe-*"
        - "nl-generic-functions"
        - "sct-*"
        - "fhir-terminology"
        - "ehds-logging"
    open-pull-requests-limit: 10
    groups:
      # One PR for every crate the FerroHEALTH family publishes, so the family
      # moves together. A dependency joins the first group it matches, so this
      # one stands before the catch-all.
      ferrohealth-family:
        patterns:
          - "ferrohealth-*"
          - "openehr-*"
          - "ferrobridge-*"
          - "fhir-types"
          - "hl7v2-types"
          - "fhirconnect"
          - "eehrxf"
          - "ihe-*"
          - "nl-generic-functions"
          - "sct-*"
          - "fhir-terminology"
          - "ehds-logging"
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
