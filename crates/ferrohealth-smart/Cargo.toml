[package]
name = "ferrohealth-smart"
description = "SMART for the openEHR ecosystem, FHIR included: the shared SMART App Launch and OAuth 2.0 resource-server crate of the FerroHEALTH products, with token validation against the authorization server's keys, the SMART on openEHR and SMART on FHIR scopes with the patient compartment, Basic and client-credentials machine authentication, and the audit line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true
readme = "README.md"
keywords = ["smart-on-fhir", "openehr", "oauth2", "jwt", "resource-server"]
categories = ["authentication", "web-programming"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md"]

# docs.rs builds every feature, so each feature-gated module is documented.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["full", "fetch"]
# Everything but the SMART on openEHR scope grammar: the resource server, the
# SMART on FHIR scopes, Basic and client-credentials authentication, the
# audit line and the configuration. A product that takes the crate with
# `default-features = false` names this feature or one that implies it.
full = [
  "dep:argon2",
  "dep:aws-lc-rs",
  "dep:base64",
  "dep:ferrohealth-secret",
  "dep:http",
  "dep:jiff",
  "dep:jsonwebtoken",
  "dep:secrecy",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:tokio",
  "dep:tracing",
  "dep:url",
]
# The HTTP fetchers: the issuer's metadata (RFC 8414 §3), its key set over
# its `jwks_uri`, and the client credentials token client. Without it the
# crate links no HTTP client, and a resource server reads its key set from
# a `jwks_file`.
fetch = ["full", "dep:reqwest"]
# The tower Layer that guards an axum router (the credential check, the
# scope check and the audit line in front of every route), the extractor of
# the caller it admitted, and the default renderer of a refusal.
axum = ["full", "dep:axum", "dep:tower"]
# The OpenID Connect relying-party client of an operator console: the
# authorization code flow with PKCE, the ID Token check, the refresh grant,
# revocation and RP-initiated logout.
oidc = ["fetch"]
# The SMART on openEHR scope grammar alone (`openehr::smart_scopes`), with no
# dependency of any kind, so a browser client builds it for wasm32.
openehr-scopes = []
# The grammar enforced beside the FHIR one: the `Requirement::OpenEhr` of a
# product route, the grant rules of the draft, and the launch context `ehrId`.
openehr = ["full", "openehr-scopes"]

[dependencies]
argon2 = { workspace = true, optional = true }
aws-lc-rs = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ferrohealth-secret = { workspace = true, optional = true }
http = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "rt", "fs"] }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

[dev-dependencies]
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
toml.workspace = true
tracing-subscriber.workspace = true
tower = { workspace = true, features = ["util"] }
axum = { workspace = true, features = ["http1", "json", "matched-path", "tokio"] }
wiremock.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true

# The integration tests drive the resource server, which the grammar alone
# does not build.
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["full"]

[lints]
workspace = true
