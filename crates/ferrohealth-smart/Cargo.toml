[package]
name = "ferrohealth-smart"
description = "SMART for the openEHR ecosystem, FHIR included: the shared SMART App Launch and OAuth 2.0 resource-server crate of the FerroHEALTH products, with token validation against the authorization server's keys, the SMART on openEHR and SMART on FHIR scopes with the patient compartment, Basic and client-credentials machine authentication, and the audit line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true
readme = "README.md"
keywords = ["smart-on-fhir", "openehr", "oauth2", "jwt", "resource-server"]
categories = ["authentication", "web-programming"]
include = ["build.rs", "src/**", "profiles/**", "tests/**", "README.md", "CHANGELOG.md"]

# docs.rs builds every feature, so each feature-gated module is documented.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["fetch"]
# The HTTP fetchers: the issuer's metadata (RFC 8414 §3), its key set over
# its `jwks_uri`, and the client credentials token client. Without it the
# crate links no HTTP client, and a resource server reads its key set from
# a `jwks_file`.
fetch = ["dep:reqwest"]
# The tower Layer that guards an axum router (the credential check, the
# scope check and the audit line in front of every route), the extractor of
# the caller it admitted, and the default renderer of a refusal.
axum = ["dep:axum", "dep:tower"]
# The OpenID Connect relying-party client of an operator console: the
# authorization code flow with PKCE, the ID Token check, the refresh grant,
# revocation and RP-initiated logout.
oidc = ["fetch"]
# The SMART on openEHR scope grammar (`openehr::smart_scopes`). It depends on
# nothing, so a browser client builds it for `wasm32-unknown-unknown`, where
# it is the whole crate.
openehr-scopes = []
# The grammar enforced beside the FHIR one: the `Requirement::OpenEhr` of a
# product route, the grant rules of the draft, and the launch context `ehrId`.
openehr = ["openehr-scopes"]
# The vendor adapter that resolves a Microsoft Entra ID groups overage through
# Microsoft Graph (`idp::entra`), named by a profile as `adapter = "idp-entra"`.
# A profile naming it fails to load in a build without this feature.
idp-entra = ["fetch", "tokio/time"]
# The eHDSI HP Identity Assertion and Treatment Relationship Confirmation
# check (`federation::assertion`): the enveloped XML signature by a trusted
# signer, the SOG-IS floor and the SAML Profile 10.0.0 §2 and §4 rules, for
# an authorization server acting for a MyHealth@EU contact point.
ehdsi-assertion = ["dep:roxmltree", "dep:x509-parser"]
# Constructors a downstream crate's tests build values with that only a
# token would otherwise carry, such as `federation::External::new` for the
# two external caller kinds. A product never enables it outside its tests.
test-support = []

# Everything but the grammar is the resource server, which a browser never
# runs, so it is compiled for every target but the browser's.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
argon2.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
ferrohealth-secret.workspace = true
http.workspace = true
jiff.workspace = true
jsonwebtoken.workspace = true
reqwest = { workspace = true, optional = true }
rustls.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "fs"] }
toml.workspace = true
tracing.workspace = true
url.workspace = true
tower = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
roxmltree = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }

[dev-dependencies]
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
tracing-subscriber.workspace = true
tower = { workspace = true, features = ["util"] }
axum = { workspace = true, features = ["http1", "json", "matched-path", "tokio"] }
wiremock.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
tempfile.workspace = true

[lints]
workspace = true
