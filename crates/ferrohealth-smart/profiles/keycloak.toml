#
# The `keycloak` issuer profile: Keycloak 26.8.2 access tokens. Each value
# is Keycloak's deviation from the `rfc9068` profile, with its source under
# docs/specs/keycloak-docs/docs/documentation/server_admin/topics/ at tag
# 26.8.2. Every key can be set on the issuer table, which wins over this
# file.

# The vendored chapters do not state the `typ` header Keycloak writes, so the
# value is a deployment's to confirm against its own server.
token_types = ["JWT"]
# clients/con-protocol-mappers.adoc, "Using lightweight access token": `exp`,
# `iat`, `jti`, `iss`, `azp` and `scope` "cannot be removed"; `sub` and `aud`
# are the claims the resource server identifies the caller and itself by.
required_claims = ["iss", "sub", "aud", "exp", "iat", "jti", "azp"]
# clients/con-protocol-mappers.adoc: `scope` is a claim of every token.
scope_claim = { claim = "scope", form = "string" }
# clients/con-protocol-mappers.adoc: `azp` is a claim of every token.
client_claims = ["azp"]
# admin-cli.adoc: "A client's service account is a user account with
# username `service-account-CLIENT_ID`", so its `sub` is a user's, never the
# client's. The deployment lists its service accounts' subjects; the empty
# list refuses the issuer at load until it does.
app_only = [{ subjects = [] }]
# docs/documentation/release_notes/topics/26_8_0.adoc, "Track impersonation
# across token lifecycle and downstream services": every token of an
# impersonation session carries the RFC 8693 §4.1 `act` claim, which "is
# always present and cannot be disabled". TokenManager.java at the tag fills
# `act.sub` with the impersonator's user id and `act.preferred_username`
# with the username, and names no `act.iss`, so the actor is read under the
# token's own issuer. An impersonation is therefore a delegation, admitted
# as `Delegated` only when `delegates` lists the impersonator and refused as
# an unlisted actor otherwise; the profile names no impersonation marker.
# A deployment that refuses every impersonation adds the built-in
# IMPERSONATOR_ID and IMPERSONATOR_USERNAME session note mappers
# (OIDCLoginProtocolFactory.java), which write `impersonator.id` and
# `impersonator.username`, and sets `impersonation_marker = "impersonator"`.
# A Keycloak older than 26.8 writes no `act`, so there the mappers and the
# marker are the only way an impersonation is seen.
#
# The onward grant: docs/specs/keycloak-docs/docs/guides/securing-apps/
# token-exchange.adoc at tag 26.8.2. No lifetime is stated there, so the
# deployment sets `max_onward_lifetime` itself.
# "Keycloak Token exchange does not yet have support for the `resource`
# parameter"; `audience` "specifies `client_id` of the client".
onward_grant = "token_exchange"
onward_indicator = "audience"
# "Example token exchange request" sends `requested_token_type`, whose
# default "is `urn:ietf:params:oauth:token-type:access_token`".
onward_parameters = { requested_token_type = "urn:ietf:params:oauth:token-type:access_token" }
# "The `subject_token` sent to the token exchange endpoint must have the
# requester client set as an audience in the `aud` claim".
onward_subject_audience = true
# "Token exchange delegation" is Preview ("is not fully supported", the
# notice of templates/features.adoc), so an `actor_token` is refused.
onward_preview = ["actor_token"]
