#
# The `rfc9068` issuer profile: a standards-only authorization server, every
# key at its default. Selected by `profile = "rfc9068"` on `[[auth.issuer]]`,
# the default. Every key below can be set on the issuer table itself.
#
# person_key = "sub"
#   OpenID Connect Core 1.0 §5.7: only `iss` with `sub` is stable.
# client_claims = ["client_id"]
#   RFC 9068 §2.2: `client_id` is REQUIRED.
# app_only = [{ sub_is_client = true }]
#   RFC 9068 §2.2 and §5: a client credentials token's `sub` "SHOULD
#   correspond to an identifier the authorization server uses to indicate
#   the client application".
# person_equality = ["iss", "sub"]
#   OpenID Connect Core 1.0 §5.7.
# token_types = ["at+jwt", "application/at+jwt"]
#   RFC 9068 §4: the `typ` header is "at+jwt" or "application/at+jwt".
# required_claims = ["iss", "exp", "aud", "sub", "client_id", "iat", "jti"]
#   RFC 9068 §2.2.
# scope_claim = { claim = "scope", form = "string" }
#   RFC 9068 §2.2.3: `scope` as defined in RFC 8693 §4.2, space-delimited.
#
# tenant_claim, guest, impersonation_marker, expect, user_claims,
# unstable_claims, first_party_clients, delegates, representation and
# adapter have no value: a deployment sets the ones its issuer needs.
#
# The onward grants (client::onward), each at its default:
# onward_grant = "token_exchange"
#   RFC 8693 §2.1.
# onward_indicator = "resource"
#   RFC 8693 §2.1 and RFC 8707 §2: an absolute URI naming the target.
# max_onward_lifetime, onward_parameters, onward_client_id,
# onward_subject_audience and onward_preview have no value: a deployment
# that uses the onward grants sets `max_onward_lifetime`.
