#
# The `okta` issuer profile: Okta access tokens. Each value is Okta's
# deviation from the `rfc9068` profile, with its source: Okta, "OpenID
# Connect & OAuth 2.0 API", the reserved claims of the access token (cache
# only, pinned by URL and sha256 in docs/specs/okta/PROVENANCE.md). Every key
# can be set on the issuer table, which wins over this file.

# The page lists `alg` and `kid` as the header's only reserved claims and
# states no `typ`, so the profile accepts none: an `okta` issuer fails to
# load until the deployment sets `token_types` itself.
token_types = []
# `uid`: "A unique identifier for the user".
person_key = "uid"
# `cid`: "Client ID of the client that requested the access token".
client_claims = ["cid"]
# The page's reserved payload claims; `sub` and `aud` are the claims the
# resource server identifies the caller and itself by.
required_claims = ["iss", "sub", "aud", "exp", "iat", "jti", "cid"]
# `scp`: "Array of scopes that are granted to this access token".
scope_claim = { claim = "scp", form = "array" }
# `uid`: "It isn't included in the access token if there is no user bound
# to it".
app_only = [{ absent_claim = "uid" }]
