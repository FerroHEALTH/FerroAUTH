[package]
name = "ferrohealth-authz"
description = "The policy decision of the FerroHEALTH products: the attribute-based request a policy enforcement point puts about the subject ferrohealth-smart authenticated, with an embedded Cedar engine and a remote decision point"
# Its own version line, released by the tag ferrohealth-authz-v<version>.
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true
readme = "README.md"
keywords = ["authorization", "abac", "cedar", "policy", "healthcare"]
categories = ["authentication", "web-programming"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md"]

# docs.rs builds every feature, so each feature-gated module is documented.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
# The embedded engine over the Cedar policy language, its schema written
# from the product's model, and the reload that swaps in a set only when it
# validates.
cedar = ["dep:cedar-policy", "dep:arc-swap", "tokio/rt", "tokio/time", "dep:tracing"]
# A remote policy decision point over HTTP, authorized with the client
# credentials token of ferrohealth-smart.
remote = ["dep:reqwest", "dep:http", "dep:serde_json", "dep:url", "ferrohealth-smart/fetch"]

[dependencies]
async-trait.workspace = true
ferrohealth-smart = { workspace = true, default-features = false }
thiserror.workspace = true
arc-swap = { workspace = true, optional = true }
cedar-policy = { workspace = true, optional = true }
http = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
secrecy.workspace = true
serde_json.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wiremock.workspace = true
tempfile.workspace = true

[lints]
workspace = true
